<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Data Assistant</title><link rel="stylesheet" href="css/styles.css"></head><body><header><h1>AI Data Assistant</h1></header><main><section><h2>데이터 요약</h2><div id="summary" aria-live="polite"></div><form id="data"><input name="date" type="date" required aria-label="날짜"><input name="value" type="number" step="any" required aria-label="값"><input name="memo" placeholder="메모" aria-label="메모"><button type="submit">데이터 추가</button></form><div id="rows"></div></section><section><h2>이전 대화</h2><div id="conversations"></div><h2>AI 채팅</h2><div id="messages" aria-live="polite"></div><form id="chat"><input id="question" required placeholder="질문을 입력하세요"><button id="send">전송</button></form></section></main><script src="js/app.js"></script></body></html>
